services:
  postgres:
    image: postgres:17
    container_name: grpc-postgres
    environment:
      POSTGRES_USER: grpc
      POSTGRES_PASSWORD: grpc
      POSTGRES_DB: grpc_playground
    ports:
      - '5432:5432'
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
